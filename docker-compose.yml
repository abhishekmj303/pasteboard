name: pasteboard

services:
  pasteboard:
    build: .
    restart: unless-stopped
    environment:
      PASTE_PASSWORD: ${PASTE_PASSWORD:?set PASTE_PASSWORD}
    volumes: ["pasteboard:/data"]
    networks: [traefik-public]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.pasteboard.loadbalancer.server.port=3000
      - traefik.http.routers.pasteboard-http.entrypoints=http
      - traefik.http.routers.pasteboard-http.rule=Host(`paste.${DOMAIN?Variable not set}`)
      - traefik.http.routers.pasteboard-http.middlewares=https-redirect
      - traefik.http.routers.pasteboard-https.entrypoints=https
      - traefik.http.routers.pasteboard-https.rule=Host(`paste.${DOMAIN?Variable not set}`)
      - traefik.http.routers.pasteboard-https.tls=true
      - traefik.http.routers.pasteboard-https.tls.certresolver=le
      - traefik.http.routers.pasteboard-https.service=pasteboard

volumes:
  pasteboard:

networks:
  traefik-public:
    external: true